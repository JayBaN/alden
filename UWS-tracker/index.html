<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal UWS Cargo Calculator</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            color: #1e293b;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 25px;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: #f0fdf4;
        }

        .upload-zone p {
            margin: 0 0 10px 0;
            color: #475569;
            font-size: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .btn-browse {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            display: inline-block;
            font-size: 14px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 25px;
        }

        .result-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .result-card h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
        }

        .result-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
        }

        .file-info {
            font-size: 13px;
            color: #0284c7;
            font-weight: 600;
            margin-top: -15px;
            margin-bottom: 20px;
            display: none;
        }

        .preview-box {
            background: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }

        .preview-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>UWS Cargo Text File Analyzer</h2>
    
    <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>Drag and drop your <strong>.txt</strong> manifest file here</p>
        <p style="font-size: 13px; color: #94a3b8;">or</p>
        <span class="btn-browse">Browse File</span>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="file-info" id="fileInfo"></div>

    <div class="results-grid">
        <div class="result-card">
            <h3>Total Pieces (PCS)</h3>
            <div class="value" id="totalPieces">0</div>
        </div>
        <div class="result-card">
            <h3>Total Weight</h3>
            <div class="value" id="totalWeight">0 <span style="font-size: 16px; font-weight: 500;">KG</span></div>
        </div>
    </div>

    <div class="preview-title" id="previewTitle">Detected File Contents:</div>
    <div class="preview-box" id="previewBox"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const totalPiecesEl = document.getElementById('totalPieces');
    const totalWeightEl = document.getElementById('totalWeight');
    const fileInfo = document.getElementById('fileInfo');
    const previewBox = document.getElementById('previewBox');
    const previewTitle = document.getElementById('previewTitle');

    fileInput.addEventListener('change', (e) => handleFile(e.target.files));

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#f0fdf4';
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.style.backgroundColor = '#f8fafc';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#f8fafc';
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files);
        }
    });

    function handleFile(files) {
        const file = files[0];
        if (!file) return;

        fileInfo.textContent = `Successfully Loaded: ${file.name}`;
        fileInfo.style.display = 'block';

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            previewBox.textContent = text;
            previewBox.style.display = 'block';
            previewTitle.style.display = 'block';

            calculateManifestTotals(text);
        };
        reader.readAsText(file);
    }

    function calculateManifestTotals(text) {
        let totalPieces = 0;
        let totalWeight = 0;

        // 1. Split the text into lines first
        const lines = text.split(/\r?\n/);
        
        // 2. Re-stitch lines where cargo descriptions overflow or break apart
        let structuredLines = [];
        for (let i = 0; i < lines.length; i++) {
            let currentLine = lines[i].trim();
            
            // If the line starts with BULK, check if the subsequent lines belong to it
            if (currentLine.toUpperCase().startsWith('BULK-')) {
                // Peek ahead: if next line is just a stray weight declaration, merge it
                while (i + 1 < lines.length && 
                       (lines[i + 1].trim().match(/^\d+\s*(?:KGS|KG|K)\b/i) || 
                        lines[i + 1].trim().toUpperCase() === 'WT')) {
                    currentLine += " " + lines[i + 1].trim();
                    i++;
                }
            }
            structuredLines.push(currentLine);
        }

        // 3. Parse the clean, reconstructed text segments
        structuredLines.forEach(line => {
            if (line.toUpperCase().includes('BULK')) {
                
                // Track all piece patterns (e.g., "3 PCS", "6 PCS", "31PC")
                const pieceMatches = line.match(/(\d+)\s*(?:PCS|PC|P)\b/gi);
                if (pieceMatches) {
                    pieceMatches.forEach(match => {
                        const num = match.match(/\d+/);
                        totalPieces += parseInt(num, 10);
                    });
                }

                // Track all weight patterns—handles "WT 147 KGS", "147KG", or "147 KGS" safely
                const weightMatches = line.match(/(?:WT\s*)?(\d+)\s*(?:KGS|KG|K)\b/gi);
                if (weightMatches) {
                    weightMatches.forEach(match => {
                        const num = match.match(/\d+/);
                        totalWeight += parseFloat(num);
                    });
                }
            }
        });

        // Display formatted calculations
        totalPiecesEl.textContent = totalPieces.toLocaleString();
        totalWeightEl.innerHTML = `${totalWeight.toLocaleString()} <span style="font-size: 16px; font-weight: 500;">KG</span>`;
    }
</script>

</body>
</html>
