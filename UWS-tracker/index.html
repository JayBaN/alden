<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alden UWS & Mail Calculator</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #121824;
            --card-bg: #1e293b;
            --text: #e2e8f0;
            --border: #334155;
            --header-bg: #0f172a;
            --accent-cyan: #38bdf8;
            --accent-gold: #ffd150;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            color: var(--accent-cyan);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .input-zone-container {
            margin-bottom: 25px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .manifest-textarea {
            width: 100%;
            height: 180px;
            background-color: var(--header-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            color: #ffffff;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .manifest-textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .category-section {
            background-color: var(--header-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .category-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .title-cargo { color: var(--accent-cyan); }
        .title-mail { color: var(--accent-gold); }
        .title-total { color: #10b981; }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .result-card {
            text-align: center;
        }

        .result-card h4 {
            margin: 0 0 4px 0;
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
        }

        .result-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }

        .unit {
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>UWS</h2>
    
    <div class="input-zone-container">
        <!-- <label for="manifestInput" class="input-label">Paste Manifest Raw Text Below:</label> -->
        <textarea 
            id="manifestInput" 
            class="manifest-textarea" 
            placeholder="Paste the FZ UWS here"></textarea>
    </div>

    <!-- CARGO SEGMENT -->
    <div class="category-section">
        <div class="category-title title-cargo">📦 Total Cargo</div>
        <div class="results-grid">
            <div class="result-card">
                <h4>Cargo Pieces</h4>
                <div class="value" id="cargoPieces">0</div>
            </div>
            <div class="result-card">
                <h4>Cargo Weight</h4>
                <div class="value" id="cargoWeight">0 <span class="unit">KG</span></div>
            </div>
        </div>
    </div>

    <!-- MAIL BAGS SEGMENT -->
    <div class="category-section">
        <div class="category-title title-mail">✉️ Total Mail</div>
        <div class="results-grid">
            <div class="result-card">
                <h4>Mail Bags</h4>
                <div class="value" id="mailPieces">0</div>
            </div>
            <div class="result-card">
                <h4>Mail Weight</h4>
                <div class="value" id="mailWeight">0 <span class="unit">KG</span></div>
            </div>
        </div>
    </div>

    <!-- COMBINED AGGREGATED DEPARTURE TOTALS -->
    <div class="category-section" style="background-color: rgba(16, 185, 129, 0.04); border-color: rgba(16, 185, 129, 0.2);">
        <div class="category-title title-total">📊 Total combined</div>
        <div class="results-grid">
            <div class="result-card">
                <h4>Total Items (Combined)</h4>
                <div class="value" id="totalPieces" style="color: #10b981;">0</div>
            </div>
            <div class="result-card">
                <h4>Total Weight (Combined)</h4>
                <div class="value" id="totalWeight" style="color: #10b981;">0 <span class="unit">KG</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    const manifestInput = document.getElementById('manifestInput');
    const cargoPiecesEl = document.getElementById('cargoPieces');
    const cargoWeightEl = document.getElementById('cargoWeight');
    const mailPiecesEl = document.getElementById('mailPieces');
    const mailWeightEl = document.getElementById('mailWeight');
    const totalPiecesEl = document.getElementById('totalPieces');
    const totalWeightEl = document.getElementById('totalWeight');

    manifestInput.addEventListener('input', () => {
        calculateManifestTotals(manifestInput.value);
    });

    function calculateManifestTotals(text) {
        let cargoPieces = 0;
        let cargoWeight = 0;
        let mailPieces = 0;
        let mailWeight = 0;

        if (!text.trim()) {
            updateDisplayFields(0, 0, 0, 0);
            return;
        }

        const lines = text.split(/\r?\n/);
        
        lines.forEach(line => {
            let currentLine = line.trim();
            if (!currentLine) return;

            // ==========================================
            // PASS A: SCAN UPPER TRACK ROUTING MATRIX FOR WEIGHTS
            // ==========================================
            if (currentLine.startsWith('-')) {
                const routingWeightMatch = currentLine.match(/^-[A-Z]{3}\/(\d+)[A-Z]/i);
                if (routingWeightMatch) {
                    const weightVal = parseFloat(routingWeightMatch[1]);
                    
                    const uppercaseLine = currentLine.toUpperCase();
                    const isMail = uppercaseLine.includes('MAIL') || 
                                   /\/M\b/.test(uppercaseLine) || 
                                   /\.M\b/.test(uppercaseLine);

                    if (isMail) {
                        mailWeight += weightVal;
                    } else {
                        cargoWeight += weightVal;
                    }
                }
            }

            // ==========================================
            // PASS B: SCAN BOTTOM LMC LINES FOR PIECES/BAGS
            // ==========================================
            if (currentLine.toUpperCase().startsWith('BULK-')) {
                // Check if this line belongs to Mail
                if (currentLine.toUpperCase().includes('MAIL') || currentLine.toUpperCase().includes('MAILBAG')) {
                    const mailBagsMatches = currentLine.match(/(\d+)\s*(?:MAILBAG|MAILBAGS|MAIL)/gi);
                    if (mailBagsMatches) {
                        mailBagsMatches.forEach(m => {
                            const val = m.match(/\d+/);
                            if (val) mailPieces += parseInt(val, 10);
                        });
                    }
                } 
                // Check if this line belongs to Cargo / Special Consolidations
                else {
                    if (currentLine.toUpperCase().includes('OUT OF')) {
                        const consolPieceMatch = currentLine.match(/(\d+)\s+OUT\s+OF/i);
                        if (consolPieceMatch) {
                            cargoPieces += parseInt(consolPieceMatch[1], 10);
                        }
                    } else {
                        // REFACTORED PIECES SCANNER: Global regex loop matches any group of digits 
                        // followed immediately or with a space by PC, PCS, or P (e.g. "03PCS", "1PCS", "13PCS", "7PCS", "01PCS")
                        const pieceRegex = /(\d+)\s*(?:PCS|PC|P)\b/gi;
                        let match;
                        while ((match = pieceRegex.exec(currentLine)) !== null) {
                            // Check to ensure it doesn't accidentally catch a trailing weight identifier like "15KGS"
                            // by ensuring the target match is not directly followed by 'K' variations
                            const matchedString = match[0].toUpperCase();
                            if (!matchedString.endsWith('KGS') && !matchedString.endsWith('KG') && !matchedString.endsWith('K')) {
cargoPieces += parseInt(match[1], 10);
}
}
}
}
}
});
updateDisplayFields(cargoPieces, cargoWeight, mailPieces, mailWeight);
}
function updateDisplayFields(cargoP, cargoW, mailP, mailW) {
cargoPiecesEl.textContent = cargoP;
cargoWeightEl.textContent = Math.round(cargoW) + " ";
mailPiecesEl.textContent = mailP;
mailWeightEl.textContent = Math.round(mailW) + " ";
totalPiecesEl.textContent = cargoP + mailP;
totalWeightEl.textContent = Math.round(cargoW + mailW) + " ";
}


</script>
