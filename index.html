<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alden Flight Tracker</title>
    <style>
        /* Base page styling - Shifted to a slightly lighter professional dark charcoal */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c2128; 
            color: #e6edf3; /* Soft white text */
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-transform: uppercase;
        }

        /* Container to handle overflow scrolling safely */
        .table-container {
            width: 100%;
            max-width: 1800px; /* Account for all columns uniformly */
            overflow-x: auto;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
            border-radius: 8px;
            margin-top: 5px;
        }

        /* Main data grid structural styles - Refined dark elevation layer */
        .flight-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #22272e; 
            font-size: 11px;
        }

        /* Precise reproduction of headers centered horizontally and vertically */
        .flight-table th {
            background-color: #181c22;
            color: #58a6ff; /* Professional blue identifier accent */
            font-weight: 600;
            padding: 14px 10px;
            border: 1px solid #444c56;
            font-size: 11px; /* Headers remain 11px */
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            vertical-align: middle;
        }

       /* All table data cells aligned strictly in the center */
        .flight-table td {
            padding: 10px;
            border: 1px solid #373e47; 
            color: #e6edf3;
            text-align: center;
            font-size: 15px; /* Data cells remain 18px */
            vertical-align: middle;
        }

        /* --- Drag and Drop Visual Feedback Styles --- */
        .flight-table tbody tr {
            cursor: grab;
            transition: background-color 0.15s ease;
        }

        .flight-table tbody tr:active {
            cursor: grabbing;
        }

        /* Styling for the row currently being dragged */
        .flight-table tbody tr.dragging {
            opacity: 0.4;
            background-color: #2d333b;
        }

        /* Visual indicator when hovering over a valid drop target */
        .flight-table tbody tr.drag-over {
            background-color: #26384f;
            outline: 2px dashed #58a6ff;
        }




        /* Monospace font for numerical columns keeping center alignment */
        .flight-table .numeric-center {
            text-align: center;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        }

        /* Highlights cells intended for raw physical manual data entry fields */
        .flight-table td[contenteditable="true"] {
            cursor: text;
            transition: background-color 0.15s ease;
        }

        .flight-table td[contenteditable="true"]:hover {
            background-color: #2d333b;
        }

        .flight-table td[contenteditable="true"]:focus {
            background-color: #2d3946;
            outline: none;
            box-shadow: inset 0 0 0 2px #58a6ff;
            color: #ffffff;
        }

        /* Checkbox styling adjustments */
        .task-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #58a6ff;
        }

        /* Interactive status cell tracking transitions */
        .loadplan-cell, .efiling-cell {
            transition: background-color 0.2s ease;
        }

        /* Professional colored background once checkboxes are selected */
        .loadplan-active {
            background-color: #7a8749 !important; /* Slightly elevated professional deep steel blue */
        }

        .efiling-active {
            background-color: #143d22 !important; /* Slightly elevated professional dark forest emerald */
        }

        /* Target strike out style specifically for the single flight code cell field */
        .flight-cell-complete {
            opacity: 0.45;
            text-decoration: line-through;
            font-style: italic;
            /*background-color: #287c05;*/
            background-color: #000000;
        }

        /* Row striping structures - Cleaner row readability contrast */
        .flight-table tr:nth-child(even) {
            background-color: #2d333b;
        }

        /* High-focus, professional semi-translucent slate blue row hover state */
        .flight-table tr:hover {
            background-color: rgba(88, 166, 255, 0.12) !important;
        }

        /* Dynamic visual feedback weights conditional evaluation text styling colors rules */
        .weight-normal {
            color: #57ab5a !important; /* Enhanced green tint for better contrast */
            font-weight: 600;
        }

        .weight-alert {
            color: #f47067 !important; /* Enhanced red tint for better contrast */
            font-weight: bold;
        }

                /* New Highlight Button Layout Style */
        .btn-highlight {
            background-color: #31363e;
            color: #adbac7;
            border: 1px solid #444c56;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .btn-highlight:hover {
            background-color: #444c56;
            color: #ffffff;
            border-color: #58a6ff;
        }

        /* Active Highlight Row State - Vivid Dark Amber/Slate Blend */
        .flight-table tbody tr.row-highlighted {
            background-color: #443e2a !important;
            border-left: 4px solid #fbbf24;
        }

        /* Remove surrounding borders from the Focus header specifically */
        .flight-table th:nth-child(1) {
            border: none;
            /* Keeps thin top/bottom borders matching your theme if needed, or remove completely */
            border-top: 1px solid #444c56;
            border-bottom: 1px solid #444c56;
        }


    /* Single Line Notes Wrapper */
    .single-line-notes {
        display: inline-flex;
        align-items: center;
        background-color: #22272e; /* Matches your table rows */
        border: 1px solid #444c56;
        border-radius: 6px;
        padding: 8px 12px;
        margin-left: 10px;
        margin-bottom: 15px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        vertical-align: middle;
        margin-top: 12px;
    }

    /* Inline Label Identifier */
    .single-line-notes label {
        font-size: 11px;
        font-weight: 600;
        color: #58a6ff; /* Signature blue identifier header */
        letter-spacing: 0.5px;
        margin-right: 10px;
        white-space: nowrap;
    }

    /* Flat Single Row Input Area */
    .single-line-notes input[type="text"] {
        background: none;
        border: none;
        color: #e6edf3;
        font-family: inherit;
        font-size: 13px;
        width: 550px; /* Adjust width to fit your spacing layout */
        padding: 4px 0;
        text-transform: uppercase; /* Uniform uppercase tracking force */
    }

    /* Reset focus ring boundaries since container handled elevation */
    .single-line-notes input[type="text"]:focus {
        outline: none;
    }

    /* Dynamic glow effect specifically when user is actively typing */
    .single-line-notes:focus-within {
        border-color: #58a6ff;
        box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.25);
        background-color: #1c2128;
    }

    /* Styled Placeholder Text */
    .single-line-notes input::placeholder {
        color: #768390;
        font-size: 11px;
    }
       
        @media print {
        /* 1. Reset the entire layout so it flows naturally onto multiple pages */
        html, body {
            background-color: #ffffff !important;
            color: #000000 !important;
            height: auto !important;
            overflow: visible !important;
            display: block !important; /* Disables flex centering for print */
            padding: 0 !important;
            margin: 0 !important;
        }

        /* Hides the flight notes panel and toolbar from the print output completely */
        .app-container, 
            .section-toolbar, 
            .textbox-card, 
            .card-footer,
            .efile {
                display: none !important;
            }

        /* 2. Release the table from the horizontal scroll container */
        .table-container {
            width: 100% !important;
            max-width: 100% !important;
            overflow: visible !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            margin: 0 !important;
            display: block !important;
        }

        /* 3. Scale and clean the table structure */
        .flight-table {
            width: 100% !important;
            background-color: #ffffff !important;
            display: table !important;
        }

        /* 4. RESTORED & OPTIMIZED THE TH ROW FOR PRINTING */
        thead {
            display: table-header-group !important; /* Forces headers to repeat on every new page */
        }
        
        .flight-table th {
            display: table-cell !important;
            background-color: #f0f4f8 !important; /* Professional light gray/blue background for paper */
            color: #004085 !important; /* Sharp dark blue for readability */
            border: 1px solid #444c56 !important;
            font-size: 11px !important;
            font-weight: bold !important;
        }

        /* 5. Style the data cells for high-contrast white paper printing */
        .flight-table td {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 1px solid #666666 !important; /* Clean gray borders for legibility */
            font-size: 12px !important; 
        }

        /* 6. Prevent table rows from getting chopped in half across pages */
        .flight-table tbody tr {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            background-color: #ffffff !important;
        }

        /* =========================================================
           7. HIDE SEARCH BAR, BUTTONS, AND INTERACTIVE FEATURES
           ========================================================= */
        /* added .search-container here to remove the top elements from paper prints */
        .search-container, 
        .dashboard-header,
        .btn-highlight, 
        button, 
        .no-print {
            display: none !important;
        }

        /* 8. Handle checked status boxes gracefully on white paper */
        .loadplan-active {
            background-color: #e2ebd5 !important; /* Light pastel green tint */
            color: #000000 !important;
        }

        .efiling-active {
            background-color: #d1ebd9 !important; /* Light pastel emerald tint */
            color: #000000 !important;
        }

        .flight-cell-complete {
            opacity: 0.6 !important;
            text-decoration: line-through !important;
            background-color: #f0f0f0 !important;
            color: #555555 !important;
        }

        /* HIDE THE FIRST COLUMN ONLY ON PAPER (Star/Drag Handle Column) */
        .flight-table th:first-child, 
        .flight-table td:first-child {
            display: none !important;
        }
    }

</style>

<script>

        const textarea = document.getElementById('huge-textbox');
const charCount = document.getElementById('char-count');

textarea.addEventListener('input', function () {
  // 1. Force Uppercase to match aviation systems layout style
  this.value = this.value.toUpperCase();

  // 2. Adjust character metric safely without shifting layout heights
  charCount.textContent = this.value.length;
});

        // 1. Flight rows creation! RUN THIS IMMEDIATELY BEFORE ANY OTHER CODE CAN CRASH


        // const sampleFlights = ["FZ991", "FZ144", "FZ337", "FZ1133", "FZ974", "FZ966", "FZ978", "FZ1716", "FZ391"];

        (function() {
    // 1. REUSABLE ROW TEMPLATE FUNCTION
    function buildAndAppendRow(tbodyElement) {
        const tr = document.createElement("tr");
        tr.setAttribute('draggable', 'true');
        tr.innerHTML = `
            <td><button class="btn-highlight" onclick="toggleRowHighlight(this)">★</button></td>
            <td contenteditable="true" data-field="flight-cell" class="prefix-cell flight-code-cell">FZ </td>
            <td contenteditable="true"></td> 
            <td class="numeric-center" contenteditable="true" data-field="ezfw" oninput="processWeightVariance(this.parentNode)"></td>
            <td contenteditable="true"></td>
            <td contenteditable="true"></td>
            <td contenteditable="true"></td>
            <td class="loadplan-cell"><input type="checkbox" class="task-checkbox" onchange="toggleCellClass(this, 'loadplan-active')"></td>
            <td contenteditable="true"></td>
            <td class="numeric-center" contenteditable="true" data-field="azfw" oninput="processWeightVariance(this.parentNode)"></td>
            <td class="numeric-center" data-field="diff">—</td>
            <td contenteditable="true" class="numeric-center" style="color:#ffd150; font-weight:bold;"></td>
            <!-- 🎯 FIXED POSITION: The checkbox now sits exactly here to line up under LOADSHEET -->
            <td class="loadsheet-cell"><input type="checkbox" class="task-checkbox" onchange="toggleLoadsheetClass(this, 'loadsheet-active')"></td>
            <td contenteditable="true"></td>
            <td contenteditable="true"></td>
            <td class="efiling-cell"><input type="checkbox" class="task-checkbox" onchange="toggleEfilingStatus(this)"></td>
        `;
        tbodyElement.appendChild(tr);
    }

    // 2. INITIAL USER PROMPT SETUP
    let rowCountInput = prompt("How many flight records rows would you like to create?", "10");
    let rowCount = parseInt(rowCountInput, 10);
    if (isNaN(rowCount) || rowCount <= 0) rowCount = 5;

    // 3. WAIT FOR WINDOW ELEMENTS TO LOAD NATIVELY
    document.addEventListener("DOMContentLoaded", () => {
        const tbody = document.getElementById("flight-data-rows");
        
        // Loop to generate initial row numbers matching user prompt input
        for (let i = 0; i < rowCount; i++) {
            buildAndAppendRow(tbody);
        }

        // 4. ATTACH THE EVENT LISTENER TO YOUR ADD BUTTON
        const singleRowBtn = document.getElementById("addNewRowBtn");
        if (singleRowBtn) {
            singleRowBtn.addEventListener("click", () => {
                buildAndAppendRow(tbody);
            });
        }
    });
})();


    function generateFolderBatchFile() {
    const rows = document.querySelectorAll('#flight-data-rows tr');
    let addedFlights = new Set();
    let flightFoldersCmd = "";

    rows.forEach(row => {
        const cells = row.getElementsByTagName('td');
        
        // Target index 1, which is explicitly the 2nd column (Flight column)
        if (cells && cells.length > 1) {
            let flightNum = cells[1].textContent.trim().toUpperCase();
            
            if (flightNum !== "" && flightNum !== "FLIGHT") {
                
                // --- MAGIC CLEANING RULE ---
                // This removes "FZ" and strips any remaining blank spaces 
                if (flightNum.startsWith("FZ")) {
                    flightNum = flightNum.replace("FZ", "").trim();
                }

                // Check again to make sure it isn't empty after stripping "FZ"
                if (flightNum !== "" && !addedFlights.has(flightNum)) {
                    addedFlights.add(flightNum);
                    
                    // 🎯 FIX: Changed " && " to a newline character "\\n"
                    // This lets Windows process each folder independently!
                    flightFoldersCmd += `mkdir "${flightNum}"\n`;
                }
            }
        }
    });
