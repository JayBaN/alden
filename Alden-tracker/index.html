<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alden Flight Tracker</title>
    <style>
        /* Base page styling - Shifted to a slightly lighter professional dark charcoal */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c2128; 
            color: #e6edf3; /* Soft white text */
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-transform: uppercase;
        }

        /* Container to handle overflow scrolling safely */
        .table-container {
            width: 100%;
            max-width: 1800px; /* Account for all columns uniformly */
            overflow-x: auto;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
            border-radius: 8px;
            margin-top: 5px;
        }

        /* Main data grid structural styles - Refined dark elevation layer */
        .flight-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #22272e; 
            font-size: 11px;
        }

        /* Precise reproduction of headers centered horizontally and vertically */
        .flight-table th {
            background-color: #181c22;
            color: #58a6ff; /* Professional blue identifier accent */
            font-weight: 600;
            padding: 14px 10px;
            border: 1px solid #444c56;
            font-size: 11px; /* Headers remain 11px */
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            vertical-align: middle;
        }

       /* All table data cells aligned strictly in the center */
        .flight-table td {
            padding: 10px;
            border: 1px solid #373e47; 
            color: #e6edf3;
            text-align: center;
            font-size: 15px; /* Data cells remain 18px */
            vertical-align: middle;
        }

        /* --- Drag and Drop Visual Feedback Styles --- */
        .flight-table tbody tr {
            cursor: grab;
            transition: background-color 0.15s ease;
        }

        .flight-table tbody tr:active {
            cursor: grabbing;
        }

        /* Styling for the row currently being dragged */
        .flight-table tbody tr.dragging {
            opacity: 0.4;
            background-color: #2d333b;
        }

        /* Visual indicator when hovering over a valid drop target */
        .flight-table tbody tr.drag-over {
            background-color: #26384f;
            outline: 2px dashed #58a6ff;
        }




        /* Monospace font for numerical columns keeping center alignment */
        .flight-table .numeric-center {
            text-align: center;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        }

        /* Highlights cells intended for raw physical manual data entry fields */
        .flight-table td[contenteditable="true"] {
            cursor: text;
            transition: background-color 0.15s ease;
        }

        .flight-table td[contenteditable="true"]:hover {
            background-color: #2d333b;
        }

        .flight-table td[contenteditable="true"]:focus {
            background-color: #2d3946;
            outline: none;
            box-shadow: inset 0 0 0 2px #58a6ff;
            color: #ffffff;
        }

        /* Checkbox styling adjustments */
        .task-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #58a6ff;
        }

        /* Interactive status cell tracking transitions */
        .loadplan-cell, .efiling-cell {
            transition: background-color 0.2s ease;
        }

        /* Professional colored background once checkboxes are selected */
        .loadplan-active {
            background-color: #7a8749 !important; /* Slightly elevated professional deep steel blue */
        }

        .efiling-active {
            background-color: #143d22 !important; /* Slightly elevated professional dark forest emerald */
        }

        /* Target strike out style specifically for the single flight code cell field */
        .flight-cell-complete {
            opacity: 0.45;
            text-decoration: line-through;
            font-style: italic;
            /*background-color: #287c05;*/
            background-color: #000000;
        }

        /* Row striping structures - Cleaner row readability contrast */
        .flight-table tr:nth-child(even) {
            background-color: #2d333b;
        }

        /* High-focus, professional semi-translucent slate blue row hover state */
        .flight-table tr:hover {
            background-color: rgba(88, 166, 255, 0.12) !important;
        }

        /* Dynamic visual feedback weights conditional evaluation text styling colors rules */
        .weight-normal {
            color: #57ab5a !important; /* Enhanced green tint for better contrast */
            font-weight: 600;
        }

        .weight-alert {
            color: #f47067 !important; /* Enhanced red tint for better contrast */
            font-weight: bold;
        }

                /* New Highlight Button Layout Style */
        .btn-highlight {
            background-color: #31363e;
            color: #adbac7;
            border: 1px solid #444c56;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .btn-highlight:hover {
            background-color: #444c56;
            color: #ffffff;
            border-color: #58a6ff;
        }

        /* Active Highlight Row State - Vivid Dark Amber/Slate Blend */
        .flight-table tbody tr.row-highlighted {
            background-color: #443e2a !important;
            border-left: 4px solid #fbbf24;
        }

        /* Remove surrounding borders from the Focus header specifically */
        .flight-table th:nth-child(1) {
            border: none;
            /* Keeps thin top/bottom borders matching your theme if needed, or remove completely */
            border-top: 1px solid #444c56;
            border-bottom: 1px solid #444c56;
        }


/* Single Line Notes Wrapper */
.single-line-notes {
    display: inline-flex;
    align-items: center;
    background-color: #22272e; /* Matches your table rows */
    border: 1px solid #444c56;
    border-radius: 6px;
    padding: 8px 12px;
    margin-left: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    vertical-align: middle;
    margin-top: 12px;
}

/* Inline Label Identifier */
.single-line-notes label {
    font-size: 11px;
    font-weight: 600;
    color: #58a6ff; /* Signature blue identifier header */
    letter-spacing: 0.5px;
    margin-right: 10px;
    white-space: nowrap;
}

/* Flat Single Row Input Area */
.single-line-notes input[type="text"] {
    background: none;
    border: none;
    color: #e6edf3;
    font-family: inherit;
    font-size: 13px;
    width: 550px; /* Adjust width to fit your spacing layout */
    padding: 4px 0;
    text-transform: uppercase; /* Uniform uppercase tracking force */
}

/* Reset focus ring boundaries since container handled elevation */
.single-line-notes input[type="text"]:focus {
    outline: none;
}

/* Dynamic glow effect specifically when user is actively typing */
.single-line-notes:focus-within {
    border-color: #58a6ff;
    box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.25);
    background-color: #1c2128;
}

/* Styled Placeholder Text */
.single-line-notes input::placeholder {
    color: #768390;
    font-size: 11px;
}
    </style>
</head>
<body>


<tr draggable="true">
    <!-- Keep your original flight columns exactly as they are here -->
</tr>
<tr draggable="true">
    <!-- Keep your original flight columns exactly as they are here -->
</tr>
<!-- Put this button right above your flight tracker table layout -->
    <div class="table-container">
    <button type="button" id="excelScriptBtn" style="background-color: #107c41; color: white; margin-left: 10px; margin-top: 10px; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 15px;">
        Create Flight Checksheet
    </button>
    <button class="btn-action" style="background-color: #55581f; color: white; margin-left: 10px; margin-top: 10px; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 15px;" onclick="generateFolderBatchFile()">Create Folder 📂</button>

    <div class="single-line-notes">
        <label for="operationalNotes">Flight Notes:</label>
        <input type="text" id="operationalNotes" placeholder="ENTER NOTES HERE..." autocomplete="off">
    </div>
        <table class="flight-table">
            <thead>
                <tr draggable="true">
                    <th style="width: 10px;"></th> <!-- Add this line here -->
                    <th>Flight</th>
                    <th>A/C REG</th> <!-- Added A/C REG column beside Flight -->
                    <th>OFP</th>
                    <th>RTOW/RZFW</th>
                    <th>Crew Config</th>
                    <th>UWS Final</th>
                    <th style="min-width: 20px; width: 30px;">Loadplan</th>
                    <th>UWS LMC</th>
                    <th>AZFW</th>
                    <th>ZFW Δ (Diff)</th>
                    <th>Final Fuel</th>
                    <th>LMC Detail</th>
                    <th>Remarks</th>
                    
                    <th style="min-width: 20px; width: 40px;">E-Filing Completed</th>
                </tr>
            </thead>
            <tbody id="flight-data-rows">
                <!-- Rows dynamically generated here by JavaScript -->

            </tbody>
        </table>
        <button type="button" id="addNewRowBtn" style="background-color: #565654; color: white; margin-top: 10px; border: none;  border-radius: 4px; cursor: pointer; font-weight: bold; padding: 7px; margin-bottom:7px; margin-left: 8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> ADD ROW
            </button>
    </div>

        <script>
        // 1. Flight rows creation! RUN THIS IMMEDIATELY BEFORE ANY OTHER CODE CAN CRASH


        // const sampleFlights = ["FZ991", "FZ144", "FZ337", "FZ1133", "FZ974", "FZ966", "FZ978", "FZ1716", "FZ391"];

        (function() {
            // 1. REUSABLE ROW TEMPLATE FUNCTION
            function buildAndAppendRow(tbodyElement) {
                const tr = document.createElement("tr");
                tr.setAttribute('draggable', 'true');
                tr.innerHTML = `
                    <td><button class="btn-highlight" onclick="toggleRowHighlight(this)">★</button></td>
                    <td contenteditable="true" data-field="flight-cell" class="prefix-cell flight-code-cell" id="flightHeader">FZ&nbsp; </td>
                    <td contenteditable="true"></td> 
                    <td class="numeric-center" contenteditable="true" data-field="ezfw" oninput="processWeightVariance(this.parentNode)"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td class="loadplan-cell"><input type="checkbox" class="task-checkbox" onchange="toggleCellClass(this, 'loadplan-active')"></td>
                    <td contenteditable="true"></td>
                    <td class="numeric-center" contenteditable="true" data-field="azfw" oninput="processWeightVariance(this.parentNode)"></td>
                    <td class="numeric-center" data-field="diff">—</td>
                    <td contenteditable="true" class="numeric-center" style="color:#ffd150; font-weight:bold;"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td class="efiling-cell"><input type="checkbox" class="task-checkbox" onchange="toggleEfilingStatus(this)"></td>
                `;
                tbodyElement.appendChild(tr);
            }

            // 2. INITIAL USER PROMPT SETUP
            let rowCountInput = prompt("How many flight records rows would you like to create?", "10");
            let rowCount = parseInt(rowCountInput, 10);
            if (isNaN(rowCount) || rowCount <= 0) rowCount = 5;

            // 3. WAIT FOR WINDOW ELEMENTS TO LOAD NATIVELY
            document.addEventListener("DOMContentLoaded", () => {
                const tbody = document.getElementById("flight-data-rows");
                
                // Loop to generate initial row numbers matching user prompt input
                for (let i = 0; i < rowCount; i++) {
                    buildAndAppendRow(tbody);
                }

                // 4. ATTACH THE EVENT LISTENER TO YOUR ADD BUTTON
                const singleRowBtn = document.getElementById("addNewRowBtn");
                if (singleRowBtn) {
                    singleRowBtn.addEventListener("click", () => {
                        buildAndAppendRow(tbody);
                    });
                }
            });
        })();




        function generateFolderBatchFile() {
    const rows = document.querySelectorAll('#flight-data-rows tr');
    let addedFlights = new Set();
    let flightFoldersCmd = "";

    rows.forEach(row => {
        const cells = row.getElementsByTagName('td');
        
        // Target index 1, which is explicitly the 2nd column (Flight column)
        if (cells && cells.length > 1) {
            let flightNum = cells[1].textContent.trim().toUpperCase();
            
            if (flightNum !== "" && flightNum !== "FLIGHT") {
                
                // --- MAGIC CLEANING RULE ---
                // This removes "FZ" and strips any remaining blank spaces 
                if (flightNum.startsWith("FZ")) {
                    flightNum = flightNum.replace("FZ", "").trim();
                }

                // Check again to make sure it isn't empty after stripping "FZ"
                if (flightNum !== "" && !addedFlights.has(flightNum)) {
                    addedFlights.add(flightNum);
                    // Build individual folder commands
                    flightFoldersCmd += `mkdir "${flightNum}" && `;
                }
            }
        }
    });

    if (addedFlights.size === 0) {
        alert("Please type your flight numbers into the Flight column first!");
        return;
    }

    // Strip the trailing " && " from the last flight folder command
    flightFoldersCmd = flightFoldersCmd.slice(0, -4);

    // 🎯 30SEP DATE FORMATTER
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, '0'); // e.g., "30"
    
    // Short month name array lookup
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const shortMonth = months[today.getMonth()]; // e.g., "SEP"
    
    const mainFolderName = `${dd}${shortMonth}`; // Combines into "30SEP"

    // 1. Create the 30SEP main folder.
    // 2. Step inside it using "cd".
    // 3. Create all flight folders inside it.
    const commandString = `mkdir "${mainFolderName}" && cd "${mainFolderName}" && ${flightFoldersCmd}`;

    navigator.clipboard.writeText(commandString).then(() => {
        alert(`I processed ${addedFlights.size} flights inside a folder named "${mainFolderName}"`);
    }).catch(err => {
        alert("Clipboard copy blocked. Please check your browser's clipboard permissions.");
        console.error(err);
    });
}






        // 2. SAFETY FALLBACK FOR WEIGHT VARIANCE
        if (typeof processWeightVariance !== 'function') {
            window.processWeightVariance = function(row) {
                console.log("Processing weight variance data row calculations...");
            };
        }

        // 3. GLOBAL ARROW NAVIGATION SYSTEM
        document.addEventListener('keydown', (e) => {
            const activeCell = document.activeElement;
            
            if (!activeCell || activeCell.tagName !== 'TD' || activeCell.getAttribute('contenteditable') !== 'true') {
                return;
            }

            const currentCellIndex = activeCell.cellIndex;
            const currentRow = activeCell.parentNode;
            let targetCell = null;

            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault(); 
                    const prevRow = currentRow.previousElementSibling;
                    if (prevRow) targetCell = prevRow.cells[currentCellIndex];
                    break;
                    
                case 'ArrowDown':
                    e.preventDefault(); 
                    const nextRow = currentRow.nextElementSibling;
                    if (nextRow) targetCell = nextRow.cells[currentCellIndex];
                    break;
                    
                case 'ArrowLeft':
                    const prevCell = activeCell.previousElementSibling;
                    if (prevCell && prevCell.getAttribute('contenteditable') === 'true') {
                        e.preventDefault();
                        targetCell = prevCell;
                    }
                    break;
                    
                case 'ArrowRight':
                    const nextCell = activeCell.nextElementSibling;
                    if (nextCell && nextCell.getAttribute('contenteditable') === 'true') {
                        e.preventDefault();
                        targetCell = nextCell;
                    }
                    break;
                    
                default:
                    return; 
            }

            if (targetCell && targetCell.getAttribute('contenteditable') === 'true') {
                targetCell.focus();
            }
        });

        // 4. LOADPLAN STATUS
        function toggleLoadplanStatus(checkbox) {
            const cell = checkbox.parentNode;
            if (checkbox.checked) {
                cell.classList.add("loadplan-active");
            } else {
                cell.classList.remove("loadplan-active");
            }
        }

        // 5. E-FILING STATUS
        function toggleEfilingStatus(checkbox) {
            const cell = checkbox.parentNode;
            const row = cell.parentNode;
            const flightCell = row.querySelector('[data-field="flight-cell"]');
            
            if (checkbox.checked) {
                cell.classList.add("efiling-active");
                if (flightCell) flightCell.classList.add("flight-cell-complete");
            } else {
                cell.classList.remove("efiling-active");
                if (flightCell) flightCell.classList.remove("flight-cell-complete");
            }
        }


        // Handles Loadplan color updates
        function toggleLoadplanStatus(checkbox) {
            const cell = checkbox.parentNode;
            if (checkbox.checked) {
                cell.classList.add("loadplan-active");
            } else {
                cell.classList.remove("loadplan-active");
            }
        }

        // Handles E-filing background and individual Flight text cross-out
        function toggleEfilingStatus(checkbox) {
            const cell = checkbox.parentNode;
            const row = cell.parentNode;
            const flightCell = row.querySelector('[data-field="flight-cell"]');
            
            if (checkbox.checked) {
                cell.classList.add("efiling-active");
                flightCell.classList.add("flight-cell-complete");
            } else {
                cell.classList.remove("efiling-active");
                flightCell.classList.remove("flight-cell-complete");
            }
        }

        // Processes mathematical variance verification
        function processWeightVariance(row) {
            const ezfwCell = row.querySelector('[data-field="ezfw"]');
            const azfwCell = row.querySelector('[data-field="azfw"]');
            const diffCell = row.querySelector('[data-field="diff"]');

            if (!ezfwCell || !azfwCell || !diffCell) return;

            const ezfw = parseFloat(ezfwCell.innerText.trim());
            const azfw = parseFloat(azfwCell.innerText.trim());

            if (isNaN(ezfw) || isNaN(azfw)) {
                diffCell.innerText = "—";
                diffCell.className = "numeric-center";
                return;
            }

            const difference = azfw - ezfw;
            const absoluteDifference = Math.abs(difference); 
            
            // Choose the professional indicator arrow based on deviation direction
            let indicator = "";
            if (difference > 0) {
                indicator = "▲ "; // Up arrow for positive weight gain
            } else if (difference < 0) {
                indicator = "▼ "; // Down arrow for negative weight drops
            }

            // Displays the arrow prefix, absolute number, and standard unit tag seamlessly
            diffCell.innerText = indicator + absoluteDifference + " KG";

            // Evaluate absolute threshold criteria (+ or - 1000)
            if (absoluteDifference >= 1000) {
                diffCell.className = "numeric-center weight-alert";  // Turns red for critical gaps >= 1000
            } else {
                diffCell.className = "numeric-center weight-normal"; // Turns green for safe variations under 1000
            }
        }

        // --- FORCE PLAIN TEXT ONLY ON PASTE ---
        document.addEventListener('paste', (e) => {
            // Only intercept if pasting inside an editable table cell
            const activeCell = document.activeElement;
            if (activeCell && activeCell.tagName === 'TD' && activeCell.getAttribute('contenteditable') === 'true') {
                e.preventDefault(); // Stop the default rich-text paste action

                // Get text representation of clipboard data
                const text = (e.originalEvent || e).clipboardData.getData('text/plain');

                // Insert the plain text into the current cursor position
                document.execCommand('insertText', false, text);
            }
        });


        function setupTableActionDelegation() {
        const tbody = document.getElementById("flight-data-rows");

        // 1. Monitors checkbox changes to toggle green/emerald backgrounds safely
        tbody.addEventListener("change", function(e) {
            const target = e.target;
            if (target.classList.contains("loadplan-chk")) {
                target.closest("td").classList.toggle("loadplan-active", target.checked);
            }
            if (target.classList.contains("efiling-chk")) {
                const td = target.closest("td");
                const tr = target.closest("tr");
                const flightCell = tr.querySelector(".flight-code-cell");
                
                td.classList.toggle("efiling-active", target.checked);
                if (flightCell) {
                    flightCell.classList.toggle("flight-cell-complete", target.checked);
                }
            }
        });

        // 2. Monitors Focus button clicks to toggle amber row highlight accents
        tbody.addEventListener("click", function(e) {
            if (e.target.classList.contains("btn-highlight")) {
                e.target.closest("tr").classList.toggle("row-highlighted");
            }
        });
    }

        function setupSafeDragAndDrop() {
            const tbody = document.getElementById("flight-data-rows");
            let draggedRow = null;

            tbody.addEventListener("dragstart", (e) => {
                draggedRow = e.target.closest("tr");
                if (draggedRow) draggedRow.classList.add("dragging");
            });

            tbody.addEventListener("dragend", () => {
                if (draggedRow) draggedRow.classList.remove("dragging");
                document.querySelectorAll("tr").forEach(tr => tr.classList.remove("drag-over"));
                draggedRow = null;
            });

            tbody.addEventListener("dragover", (e) => {
                e.preventDefault();
                const targetRow = e.target.closest("tr");
                if (targetRow && targetRow !== draggedRow && targetRow.parentNode === tbody) {
                    targetRow.classList.add("drag-over");
                }
            });

            tbody.addEventListener("drop", (e) => {
                e.preventDefault();
                const targetRow = e.target.closest("tr");
                if (targetRow && draggedRow && targetRow !== draggedRow) {
                    targetRow.classList.remove("drag-over");
                    
                    // Calculate cursor placement height over the active target row
                    const bounding = targetRow.getBoundingClientRect();
                    const offset = e.clientY - bounding.top;
                    
                    // CRUCIAL BUG FIX: Move memory pointers directly instead of text mutations
                    if (offset > bounding.height / 2) {
                        targetRow.after(draggedRow);
                    } else {
                        targetRow.before(draggedRow);
                    }
                }
            });
        }



        document.addEventListener("DOMContentLoaded", () => {
            const tbody = document.getElementById("flight-data-rows");

            // Click Event: Snap the typing cursor to the end of the text
            tbody.addEventListener("click", (e) => {
                const cell = e.target.closest('[data-field="flight-cell"]');
                if (!cell) return;

                // Force cursor to the end of the text string
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(cell);
                range.collapse(false); // false collapses the range to the end
                sel.removeAllRanges();
                sel.addRange(range);
            });
        });


        document.addEventListener("DOMContentLoaded", () => {
            const tbody = document.getElementById("flight-data-rows");
            const prefixLength = 3; // Length of "FZ "

            // Helper function to force cursor to the end of the text
            function forceCursorToEnd(cell) {
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(cell);
                range.collapse(false); // collapse to the end
                sel.removeAllRanges();
                sel.addRange(range);
            }

            // Handle both Clicks and Arrow Key navigation
            ["click", "keyup"].forEach(eventType => {
                tbody.addEventListener(eventType, (e) => {
                    const cell = e.target.closest('[data-field="flight-cell"]');
                    if (!cell) return;

                    const sel = window.getSelection();
                    
                    // Check if the cursor position is inside or before the "FZ " prefix
                    if (sel.anchorNode && (sel.anchorNode === cell || cell.contains(sel.anchorNode))) {
                        if (sel.anchorOffset < prefixLength) {
                            forceCursorToEnd(cell);
                        }
                    }
                });
            });
        });



        document.addEventListener('DOMContentLoaded', () => {
        const tbody = document.querySelector('.flight-table tbody');
        if (!tbody) return;

        // 1. Automatically inject draggable="true" into all existing table rows
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(row => {
            row.setAttribute('draggable', 'true');
        });

        // --- Keep your drag and drop logic below this line ---
        let draggedRow = null;

        tbody.addEventListener('dragstart', (e) => {
            const row = e.target.closest('tr');
            if (!row) return;
            draggedRow = row;
            row.classList.add('dragging');
            e.dataTransfer.setData('text/plain', '');
            e.dataTransfer.effectAllowed = 'move';
        });

        tbody.addEventListener('dragend', (e) => {
            const row = e.target.closest('tr');
            if (row) row.classList.remove('dragging');
            document.querySelectorAll('.flight-table tbody tr').forEach(el => el.classList.remove('drag-over'));
            draggedRow = null;
        });

        tbody.addEventListener('dragover', (e) => {
            e.preventDefault();
            const row = e.target.closest('tr');
            if (!row || row === draggedRow) return;
            e.dataTransfer.dropEffect = 'move';
        });

        tbody.addEventListener('dragenter', (e) => {
            const row = e.target.closest('tr');
            if (!row || row === draggedRow) return;
            row.classList.add('drag-over');
        });

        tbody.addEventListener('dragleave', (e) => {

        tbody.addEventListener('drop', (e) => {

            const targetRow = e.target.closest('tr');
            if (!targetRow || targetRow === draggedRow) return;

        // Safe status color backdrop toggler
        function toggleCellClass(checkbox, className) {
            const td = checkbox.parentNode;
            if (checkbox.checked) {
                td.classList.add(className);
            } else {
                td.classList.remove(className);
            }
        }


        // Node-Safe Drag Engine (Preserves checked elements and written cell data)
        function initializeDragAndDropEngine(tbody) {
            let draggedRow = null;

            tbody.addEventListener('dragstart', (e) => {
                const row = e.target.closest('tr');
                
                // Block dragging if someone is actively typing inside an editable cell text field
                if (!row || document.activeElement.getAttribute('contenteditable') === 'true') {
                    e.preventDefault();
                    return;
                }
                draggedRow = row;
                row.classList.add('dragging');
                e.dataTransfer.setData('text/plain', '');
                e.dataTransfer.effectAllowed = 'move';
            });

            tbody.addEventListener('dragend', (e) => {
                const row = e.target.closest('tr');
                if (row) row.classList.remove('dragging');
                document.querySelectorAll('#flight-data-rows tr').forEach(el => el.classList.remove('drag-over'));
                draggedRow = null;
            });

            tbody.addEventListener('dragover', (e) => {
                e.preventDefault();
                const row = e.target.closest('tr');
                if (!row || row === draggedRow) return;
                e.dataTransfer.dropEffect = 'move';
            });

            tbody.addEventListener('dragenter', (e) => {
                const row = e.target.closest('tr');
                if (!row || row === draggedRow) return;
                row.classList.add('drag-over');
            });

            tbody.addEventListener('dragleave', (e) => {
                const row = e.target.closest('tr');
                if (row) row.classList.remove('drag-over');
            });

            tbody.addEventListener('drop', (e) => {
                e.preventDefault();
                const targetRow = e.target.closest('tr');
                if (!targetRow || targetRow === draggedRow) return;

                targetRow.classList.remove('drag-over');

                const allRows = Array.from(tbody.children);
                const draggedIndex = allRows.indexOf(draggedRow);
                const targetIndex = allRows.indexOf(targetRow);

                // Moves the actual row containers in the DOM tree, keeping all ticks and text 100% safe
                if (draggedIndex < targetIndex) {
                    tbody.insertBefore(draggedRow, targetRow.nextSibling);
                } else {
                    tbody.insertBefore(draggedRow, targetRow);
                }
            });
        }

        // Click handler function to highlight/unhighlight flight rows instantly
        function toggleRowHighlight(button) {
            const row = button.closest('tr');
            if (row) {
                row.classList.toggle('row-highlighted');
                // Switch star symbols to provide visual feedback
                button.textContent = row.classList.contains('row-highlighted') ? '⭐' : '★';
            }
        }






     document.getElementById('excelScriptBtn').addEventListener('click', async function() {
    // 🎯 CONFIGURATION: Change this number to your exact column position (from left to right)
    const columnNumber = 2; 

    // 1. Target every single cell in that exact column across the whole table
    const targetCells = document.querySelectorAll(`table tr td:nth-child(${columnNumber}), table tr th:nth-child(${columnNumber})`);
    
    const uniqueFlights = [];
    let skippedHeader = false;

    targetCells.forEach(cell => {
        const cellText = cell.innerText.trim();
        
        if (cellText) {
            // 🛑 SKIP THE FIRST CELL (The Column Header Name)
            if (!skippedHeader) {
                skippedHeader = true; 
                return; 
            }

            // Filter out duplicate values so sheet names stay unique
            if (!uniqueFlights.includes(cellText)) {
                uniqueFlights.push(cellText);
            }
        }
    });

    if (uniqueFlights.length === 0) {
        alert("No flight data rows found at column position " + columnNumber + " after skipping the header.");
        return;
    }

    // 2. Format the text array cleanly into the exact structure Office Scripts expects
    const arrayString = uniqueFlights.map(f => `        "${f.replace(/"/g, '\\"')}"`).join(",\n");

    // 3. Build the complete ready-to-run script payload text block
    const fullScriptCode = `function main(workbook: ExcelScript.Workbook) {
    // Automatically grabbed from your flight tracker app!
    let targetSheetNames = [
\n${arrayString}
    ];

    let templateSheet = workbook.getActiveWorksheet();
    
    targetSheetNames.forEach(name => {
        let safeName = name.replace(/[\\\\\\/\\?\\*\\:\\[\\]]/g, "").substring(0, 31);
        let existingSheet = workbook.getWorksheet(safeName);
        if (!existingSheet) {
            let newSheet = templateSheet.copy(ExcelScript.WorksheetPositionType.end);
            newSheet.setName(safeName);
        }
    });
    
    console.log("Successfully created all flight sheets!");
}`;

    // 4. Copy directly to clipboard without downloading any file
    try {
        await navigator.clipboard.writeText(fullScriptCode);
        
        // Visual confirmation: Change button appearance temporarily to confirm copy
        const btn = document.getElementById('excelScriptBtn');
        const originalText = btn.innerText;
        const originalBg = btn.style.backgroundColor;
        
        btn.innerText = "✓ Code Copied!";
        btn.style.backgroundColor = "#219653";
        
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = originalBg;
        }, 2000);
        
    } catch (err) {
        alert("Failed to copy to clipboard automatically. Check your browser permissions.");
    }
});
