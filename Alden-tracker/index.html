<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alden Flight Tracker</title>
    <style>
        /* Base page styling - Shifted to a slightly lighter professional dark charcoal */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c2128; 
            color: #e6edf3; /* Soft white text */
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container to handle overflow scrolling safely */
        .table-container {
            width: 100%;
            max-width: 1650px; /* Account for all columns uniformly */
            overflow-x: auto;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
            border-radius: 8px;
            margin-top: 20px;
        }

        /* Main data grid structural styles - Refined dark elevation layer */
        .flight-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #22272e; 
            font-size: 13px;
        }

        /* Precise reproduction of headers centered horizontally and vertically */
        .flight-table th {
            background-color: #181c22;
            color: #58a6ff; /* Professional blue identifier accent */
            font-weight: 600;
            padding: 14px 10px;
            border: 1px solid #444c56;
            font-size: 11px; /* Headers remain 11px */
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            vertical-align: middle;
        }

        /* All table data cells aligned strictly in the center */
        .flight-table td {
            padding: 10px;
            border: 1px solid #373e47; 
            color: #e6edf3; /* High-visibility white/silver text */
            min-width: 90px;
            font-size: 18px; /* Data cells remain 18px */
            text-align: center;
            vertical-align: middle;
            transition: background-color 0.15s ease; /* Smooth hover transition */
        }

        /* Monospace font for numerical columns keeping center alignment */
        .flight-table .numeric-center {
            text-align: center;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        }

        /* Highlights cells intended for raw physical manual data entry fields */
        .flight-table td[contenteditable="true"] {
            cursor: text;
            transition: background-color 0.15s ease;
        }

        .flight-table td[contenteditable="true"]:hover {
            background-color: #2d333b;
        }

        .flight-table td[contenteditable="true"]:focus {
            background-color: #2d3946;
            outline: none;
            box-shadow: inset 0 0 0 2px #58a6ff;
            color: #ffffff;
        }

        /* Checkbox styling adjustments */
        .task-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #58a6ff;
        }

        /* Interactive status cell tracking transitions */
        .loadplan-cell, .efiling-cell {
            transition: background-color 0.2s ease;
        }

        /* Professional colored background once checkboxes are selected */
        .loadplan-active {
            background-color: #1a3a5f !important; /* Slightly elevated professional deep steel blue */
        }

        .efiling-active {
            background-color: #143d22 !important; /* Slightly elevated professional dark forest emerald */
        }

        /* Target strike out style specifically for the single flight code cell field */
        .flight-cell-complete {
            opacity: 0.45;
            text-decoration: line-through;
            font-style: italic;
            background-color: #287c05;
        }

        /* Row striping structures - Cleaner row readability contrast */
        .flight-table tr:nth-child(even) {
            background-color: #2d333b;
        }

        /* High-focus, professional semi-translucent slate blue row hover state */
        .flight-table tr:hover {
            background-color: rgba(88, 166, 255, 0.12) !important;
        }

        /* Dynamic visual feedback weights conditional evaluation text styling colors rules */
        .weight-normal {
            color: #57ab5a !important; /* Enhanced green tint for better contrast */
            font-weight: 600;
        }

        .weight-alert {
            color: #f47067 !important; /* Enhanced red tint for better contrast */
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <table class="flight-table">
            <thead>
                <tr>
                    <th>Flight</th>
                    <th>A/C REG</th> <!-- Added A/C REG column beside Flight -->
                    <th>OFP</th>
                    <th>RTOW/RZFW</th>
                    <th>Crew Config</th>
                    <th>UWS Final</th>
                    <th>UWS LMC</th>
                    <th>AZFW</th>
                    <th>ZFW Δ (Diff)</th>
                    <th>Final Fuel</th>
                    <th>LMC Detail</th>
                    <th>Remarks</th>
                    <th style="min-width: 70px; width: 90px;">Loadplan</th>
                    <th style="min-width: 130px; width: 150px;">E-Filing Completed</th>
                </tr>
            </thead>
            <tbody id="flight-data-rows">
                <!-- Rows dynamically generated here by JavaScript -->
            </tbody>
        </table>
    </div>

        <script>
        // 1. RUN THIS IMMEDIATELY BEFORE ANY OTHER CODE CAN CRASH
        (function() {
            let rowCountInput = prompt("How many flight records rows would you like to create?", "10");
            let rowCount = parseInt(rowCountInput, 10);
            if (isNaN(rowCount) || rowCount <= 0) rowCount = 5;

            // Wait for DOM to be ready to insert rows
            document.addEventListener("DOMContentLoaded", () => {
                const tbody = document.getElementById("flight-data-rows");
                for (let i = 0; i < rowCount; i++) {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td contenteditable="true" data-field="flight-cell"></td>
                        <td contenteditable="true"></td> 
                        <td class="numeric-center" contenteditable="true" data-field="ezfw" oninput="processWeightVariance(this.parentNode)"></td>
                        <td contenteditable="true"></td>
                        <td contenteditable="true"></td>
                        <td contenteditable="true"></td>
                        <td contenteditable="true"></td>
                        <td class="numeric-center" contenteditable="true" data-field="azfw" oninput="processWeightVariance(this.parentNode)"></td>
                        <td class="numeric-center" data-field="diff">—</td>
                        <td contenteditable="true"></td>
                        <td contenteditable="true"></td>
                        <td contenteditable="true"></td>
                        <td class="loadplan-cell"><input type="checkbox" class="task-checkbox" onchange="toggleLoadplanStatus(this)"></td>
                        <td class="efiling-cell"><input type="checkbox" class="task-checkbox" onchange="toggleEfilingStatus(this)"></td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        })();

        // 2. SAFETY FALLBACK FOR WEIGHT VARIANCE
        if (typeof processWeightVariance !== 'function') {
            window.processWeightVariance = function(row) {
                console.log("Processing weight variance data row calculations...");
            };
        }

        // 3. GLOBAL ARROW NAVIGATION SYSTEM
        document.addEventListener('keydown', (e) => {
            const activeCell = document.activeElement;
            
            if (!activeCell || activeCell.tagName !== 'TD' || activeCell.getAttribute('contenteditable') !== 'true') {
                return;
            }

            const currentCellIndex = activeCell.cellIndex;
            const currentRow = activeCell.parentNode;
            let targetCell = null;

            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault(); 
                    const prevRow = currentRow.previousElementSibling;
                    if (prevRow) targetCell = prevRow.cells[currentCellIndex];
                    break;
                    
                case 'ArrowDown':
                    e.preventDefault(); 
                    const nextRow = currentRow.nextElementSibling;
                    if (nextRow) targetCell = nextRow.cells[currentCellIndex];
                    break;
                    
                case 'ArrowLeft':
                    const prevCell = activeCell.previousElementSibling;
                    if (prevCell && prevCell.getAttribute('contenteditable') === 'true') {
                        e.preventDefault();
                        targetCell = prevCell;
                    }
                    break;
                    
                case 'ArrowRight':
                    const nextCell = activeCell.nextElementSibling;
                    if (nextCell && nextCell.getAttribute('contenteditable') === 'true') {
                        e.preventDefault();
                        targetCell = nextCell;
                    }
                    break;
                    
                default:
                    return; 
            }

            if (targetCell && targetCell.getAttribute('contenteditable') === 'true') {
                targetCell.focus();
            }
        });

        // 4. LOADPLAN STATUS
        function toggleLoadplanStatus(checkbox) {
            const cell = checkbox.parentNode;
            if (checkbox.checked) {
                cell.classList.add("loadplan-active");
            } else {
                cell.classList.remove("loadplan-active");
            }
        }

        // 5. E-FILING STATUS
        function toggleEfilingStatus(checkbox) {
            const cell = checkbox.parentNode;
            const row = cell.parentNode;
            const flightCell = row.querySelector('[data-field="flight-cell"]');
            
            if (checkbox.checked) {
                cell.classList.add("efiling-active");
                if (flightCell) flightCell.classList.add("flight-cell-complete");
            } else {
                cell.classList.remove("efiling-active");
                if (flightCell) flightCell.classList.remove("flight-cell-complete");
            }
        }
    </script>


    <script>


        // Handles Loadplan color updates
        function toggleLoadplanStatus(checkbox) {
            const cell = checkbox.parentNode;
            if (checkbox.checked) {
                cell.classList.add("loadplan-active");
            } else {
                cell.classList.remove("loadplan-active");
            }
        }

        // Handles E-filing background and individual Flight text cross-out
        function toggleEfilingStatus(checkbox) {
            const cell = checkbox.parentNode;
            const row = cell.parentNode;
            const flightCell = row.querySelector('[data-field="flight-cell"]');
            
            if (checkbox.checked) {
                cell.classList.add("efiling-active");
                flightCell.classList.add("flight-cell-complete");
            } else {
                cell.classList.remove("efiling-active");
                flightCell.classList.remove("flight-cell-complete");
            }
        }

        // Processes mathematical variance verification
        function processWeightVariance(row) {
            const ezfwCell = row.querySelector('[data-field="ezfw"]');
            const azfwCell = row.querySelector('[data-field="azfw"]');
            const diffCell = row.querySelector('[data-field="diff"]');

            if (!ezfwCell || !azfwCell || !diffCell) return;

            const ezfw = parseFloat(ezfwCell.innerText.trim());
            const azfw = parseFloat(azfwCell.innerText.trim());

            if (isNaN(ezfw) || isNaN(azfw)) {
                diffCell.innerText = "—";
                diffCell.className = "numeric-center";
                return;
            }

            const difference = azfw - ezfw;
            const absoluteDifference = Math.abs(difference); 
            
            // Choose the professional indicator arrow based on deviation direction
            let indicator = "";
            if (difference > 0) {
                indicator = "▲ "; // Up arrow for positive weight gain
            } else if (difference < 0) {
                indicator = "▼ "; // Down arrow for negative weight drops
            }

            // Displays the arrow prefix, absolute number, and standard unit tag seamlessly
            diffCell.innerText = indicator + absoluteDifference + " KG";

            // Evaluate absolute threshold criteria (+ or - 1000)
            if (absoluteDifference >= 1000) {
                diffCell.className = "numeric-center weight-alert";  // Turns red for critical gaps >= 1000
            } else {
                diffCell.className = "numeric-center weight-normal"; // Turns green for safe variations under 1000
            }
        }

        // --- FORCE PLAIN TEXT ONLY ON PASTE ---
        document.addEventListener('paste', (e) => {
            // Only intercept if pasting inside an editable table cell
            const activeCell = document.activeElement;
            if (activeCell && activeCell.tagName === 'TD' && activeCell.getAttribute('contenteditable') === 'true') {
                e.preventDefault(); // Stop the default rich-text paste action

                // Get text representation of clipboard data
                const text = (e.originalEvent || e).clipboardData.getData('text/plain');

                // Insert the plain text into the current cursor position
                document.execCommand('insertText', false, text);
            }
        });
    </script>
</body>
</html>
